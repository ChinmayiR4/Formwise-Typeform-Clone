# Render Blueprint — deploys the FastAPI backend.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: formwise-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite:///./formwise.db
      - key: SEED_ON_STARTUP
        value: "true"
      # Your Cloudflare Pages URL(s), comma separated. Use * while testing.
      - key: CORS_ORIGINS
        sync: false
      # Optional: Hugging Face access token (read scope) for real AI features.
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
